# Narrator config (docs/narrator.md). Lead-owned; the narrator worker asks for changes.
version: 1

llm:
  model: claude-sonnet-5-5        # the user's choice 2026-10-10 ("sonnet for now")
  effort: medium                  # output_config.effort; tune in eval
  max_tokens: 16000
  # USD per 1M tokens (Claude API, cached 2026-10-06), for the cost record and the daily limit.
  price_input_per_mtok: 2.0
  price_output_per_mtok: 10.0
  api_key_env: ANTHROPIC_API_KEY  # read from .env; never logged
  workspace_id_env: ANTHROPIC_WORKSPACE_ID  # the key is org-level: send header anthropic-workspace-id

max_cost_usd_per_day: 5.0         # the user's limit; over it -> template text + banner
prompt_version: "n12"             # bump on any prompt change (part of the cache key); n12 = N16 + no ";" joins; n11 = N16 (client page); n10 = N15 (current split, rule 9); n9 = N13c
cache_dir: data/narratives
# N13: one fixed risk note per asset class (D19 classes) for the facts pack; the
# LLM may use them in oneriler (sentence c) and dikkat. Plain, no promises.
risk_notes:
  by_class:
    nakit_benzeri: {TR: "Getirisi faiz değişimine bağlıdır; mevduat gibi anapara güvencesi yoktur.", EN: "Its return follows interest rates; unlike a deposit, the principal is not insured."}
    borclanma: {TR: "Faizler yükselirse fonun değeri düşebilir; vade uzadıkça dalgalanma artar.", EN: "If interest rates rise, the fund can lose value; longer maturities move more."}
    dengeli: {TR: "Birden çok varlık sınıfı taşır; hisse ve tahvil fiyatlarıyla birlikte dalgalanır.", EN: "It holds several asset classes and moves with share and bond prices."}
    hisse: {TR: "Pay piyasasıyla birlikte kısa sürede belirgin değer kaybı yaşanabilir.", EN: "With the share market it can lose a clear part of its value in a short time."}
    altin_doviz: {TR: "Altın fiyatı ve kur hareketiyle dalgalanır; TL bazında değer kaybı olabilir.", EN: "It moves with the gold price and the exchange rate; it can lose value in TL."}
  by_kind:
    time_deposit: {TR: "Vade dolmadan çekilirse faiz kaybı olabilir.", EN: "Withdrawing before maturity can cost the interest."}
    deposit: {TR: "Faiz oranı değişebilir; enflasyon sonrası değer kaybı olabilir.", EN: "The rate can change; after inflation it can lose value."}
    # D26: exchange products
    etf: {TR: "Borsada işlem görür; fiyatı gün içinde değişir ve satış tutarı 2 iş günü sonra hesaba geçer.", EN: "It trades on the exchange; its price moves during the day and the sale amount arrives after 2 business days."}
    stock: {TR: "Tek bir şirketin payıdır; şirkete özgü gelişmelerle kısa sürede büyük değer kaybı olabilir.", EN: "It is the share of one company; company news can cause a large loss in a short time."}

# v1.4 dashboard brief (docs/web-ui.md "LLM brief"; narrator N10): 1-2 sentences for
# the RM, no retry, the plain sentence as fallback; same daily cost limit
brief:
  model: claude-haiku-5-5
  max_chars: 280
  prompt_version: "b1"
  price_input_per_mtok: 0.10      # Haiku 5.5, prompts up to 100K tokens
  price_output_per_mtok: 0.50

langs: [TR, EN]
sections: [ozet, oneriler, alternatifler, dikkat, sorular, teklif_metni, varsayimlar, talking_points]

# Rule 6 of the brief: no guarantee or certain return. Matched case-insensitively
# after Turkish lower-casing; a hit fails the validator.
forbidden_phrases:
  TR: [garanti, garantili, "kesin getiri", "kesin kazanç", risksiz, "risk yok",
       kaybetmezsiniz, "mutlaka kazandırır", "zarar etmezsiniz"]
  EN: [guarantee, guaranteed, "certain return", "risk-free", "no risk",
       "cannot lose", "will definitely", "sure profit"]

# Every text must say this (rule 9): a preparation for the RM, not advice.
disclaimer:
  TR: "Bu metin RM'in görüşme hazırlığı içindir; yatırım tavsiyesi değildir."
  EN: "This text is meeting preparation for the RM; it is not investment advice."

# W15 / N14 (2026-10-14): the EVDS market note (dashboard card and the deletable
# meeting-text block piyasa_notu). Entities as in config/sources.yaml.
market_note:
  series:
    # The BIS copy is monthly (dated at the month end). last_change: the date of the
    # last TCMB decision, shown only while the EVDS value equals `value` (checked on
    # the TCMB one-week repo page 2026-10-09: 37.00 % since 23.01.2026). A new TCMB
    # decision makes the note disappear by itself; then update the date and value.
    - {key: policy_rate, quantity: policy_rate, entity: "CBRT policy rate (monthly, BIS)", unit: pct,
       label: {TR: "Politika faizi", EN: "Policy rate"},
       last_change: {date: "2026-01-23", value: 37.0, label: {TR: "son değişiklik {date}", EN: "last change {date}"}}}
    - {key: usd_try, quantity: usd_try, entity: "USD/TRY CBRT buying rate", unit: TRY,
       label: {TR: "USD/TRY (TCMB alış)", EN: "USD/TRY (CBRT buying)"}}
    - {key: funding_cost, quantity: cbrt_funding_cost, entity: "CBRT weighted average funding cost", unit: pct,
       label: {TR: "TCMB ağırlıklı ortalama fonlama maliyeti", EN: "CBRT weighted average funding cost"}}
  # N14: one sentence per series in the meeting-text block piyasa_notu (code-written)
  sentence:
    TR: "{label} {value} (TCMB EVDS, {date})."
    EN: "{label} {value} (CBRT EVDS, {date})."

# N15 (2026-10-14): the client's current split (decision D27). Only active rows
# (RM values or the client file) are stated; estimates are never given as figures.
allocation:
  gap_under: {TR: "{class_label} payı {source_label} {current}; model bandı {low}–{high}, bandın {gap} puan altında.", EN: "{class_label} share {source_label}: {current}; model band {low}–{high}, {gap} points below the band."}
  gap_over: {TR: "{class_label} payı {source_label} {current}; model bandı {low}–{high}, bandın {gap} puan üstünde.", EN: "{class_label} share {source_label}: {current}; model band {low}–{high}, {gap} points above the band."}
  split_unknown: {TR: "Mevcut portföy dağılımı bilinmiyor; müşteriden alınmalı.", EN: "The client's current portfolio split is unknown; ask the client for it."}
  class_labels: {nakit_benzeri: {TR: "Nakit benzeri", EN: "Cash-like"}, borclanma: {TR: "Borçlanma araçları", EN: "Debt instruments"}, hisse: {TR: "Hisse senedi", EN: "Equities"}, altin_doviz: {TR: "Altın ve döviz", EN: "Gold and FX"}, dengeli: {TR: "Dengeli fon", EN: "Balanced funds"}}
  source_labels: {rm: {TR: "RM'e göre", EN: "according to the RM"}, rm_confirmed: {TR: "RM onaylı tahmine göre", EN: "according to the estimate the RM confirmed"}, persona_text: {TR: "müşteri dosyasına göre", EN: "according to the client file"}}
