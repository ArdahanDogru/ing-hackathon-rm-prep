# Decision layer configuration (docs/decision.md). Lead-owned.
# Every table, weight, penalty, threshold and text of the engine lives here;
# tuning is a change of this file, not of the code. config_hash = sha256 of
# this file AS PARSED (comments and spacing do not change it).
version: 1

# --- 1. Product universe --------------------------------------------------------
deposit:
  option_id: "deposit:ing_turuncu"
  label: "ING Turuncu Hesap (standart)"
  source: manual
  quantity: deposit_rate
  # entity = "<entity_prefix>, <tier>"; the persona has no amount, so one tier.
  entity_prefix: "ING Turuncu Hesap standart"
  tier: "100.000-249.999 TL"
  # EVDS market average, for the deposit_vs_market warning.
  market_entity: "TRY savings deposit rate up to 3M, weighted average (new deposits)"

# ING e-Vadeli Mevduat: one ranked option (contract v1.1, docs/decision.md section 1).
# entity = "<entity_prefix>, <term>, <tier>" (data/inbox/manual/ing_e_vadeli.csv).
time_deposit:
  option_id: "time_deposit:ing_e_vadeli"
  label: "ING e-Vadeli Mevduat"
  source: manual
  quantity: deposit_rate
  entity_prefix: "ING e-Vadeli Mevduat"
  term: "32-45 gün"
  tier: "99.999,99-250.000 TL"   # the column that holds 100.000-249.999 TL
  term_days: 32                 # renewed every 32 days (compounding of the net rate)

# Real return after tax (docs/decision.md 4.1b, D9). Rows in data/inbox/manual/.
real_return:
  cpi: {source: manual, quantity: cpi_annual, entity: "TÜFE yıllık değişim (TÜİK)"}
  stopaj:
    source: manual
    quantity: withholding_tax_rate
    deposit: "TL vadesiz mevduat ve günlük hesap (Turuncu Hesap türü)"
    time_deposit: "TL vadeli mevduat, 6 aya kadar vadeli"
    fund_default: "Yatırım fonu, diğer fonlar (değişken, borçlanma araçları, fon sepeti)"
    fund_by_kind: {money_market: "Yatırım fonu, para piyasası fonu"}
  loss_scale: 0.10              # real_loss violation = clamp(-r / loss_scale, 0, 1)

# EntityInfo.category (TEFAS umbrella type) -> fund_kind; null = not in the universe.
fund_kinds:
  "Para Piyasası Şemsiye Fonu": money_market
  "Borçlanma Araçları Şemsiye Fonu": debt
  "Katılım Şemsiye Fonu": participation
  "Kıymetli Madenler Şemsiye Fonu": precious_metals
  "Hisse Senedi Şemsiye Fonu": equity
  "Değişken Şemsiye Fonu": variable
  "Karma Şemsiye Fonu": mixed
  "Fon Sepeti Şemsiye Fonu": fund_of_funds
  "Serbest Şemsiye Fonu": null     # qualified investors only

# Upper-case fund name contains one of these -> fx = true.
fx_name_words: ["DÖVİZ", "EUROBOND", "DOLAR"]

# --- 3. Persona text -> levels -----------------------------------------------------
# Keys are matched after normalization (Turkish lower case, spaces collapsed,
# punctuation dropped except + and -). No fuzzy matching.
risk_profiles:
  "Muhafazakâr": {ceiling: 2, appetite: 0.0}
  "Temkinli": {ceiling: 3, appetite: 0.3333333333}
  "Dengeli": {ceiling: 5, appetite: 0.6666666667}
  "Agresif": {ceiling: 7, appetite: 1.0}

horizon:
  # years <= max_years -> period; the last entry has no max.
  periods:
    - {max_years: 1, period: 6m}
    - {max_years: 3, period: 1y}
    - {max_years: null, period: 3y}
  years: {3m: 0.25, 6m: 0.5, 1y: 1, 3y: 3, 5y: 5}
  # fund_return_<period>; next shorter one if missing.
  fallback: [3y, 1y, 6m, 3m]

levels: {"Düşük": 0.0, "Orta": 0.5, "Yüksek": 1.0}

fx_levels: {"Sınırlı": 1.0, "Açık": 0.0, "Çeşitlendirilmiş": 0.0}

# Safe level used (with an assumption) while a non-blocking question is open.
safe_levels:
  yatirim_ufku: 6m
  likidite_ihtiyaci: "Yüksek"
  anapara_koruma_tercihi: "Yüksek"
  gelir_nakit_akisi_ihtiyaci: "Orta"
  doviz_maruz_kalma_tercihi: "Sınırlı"

# oncelikler phrase -> effect. boost:<criterion> adds priority_boost to its raw
# weight; diversity sets the cap of the first 10 to diversity_cap; note:<key>
# only adds the assumption text assumptions.<key>.
priorities:
  "düzenli gelir": boost:income
  "likiditeyi koruma": boost:liquidity
  "erişilebilir likidite": boost:liquidity
  "yüksek likidite": boost:liquidity
  "sınırlı dalgalanma": boost:low_risk
  "uzun vadeli dayanıklılık": boost:low_risk
  "sermayenin korunması": boost:principal
  "uzun vadeli büyüme": boost:return
  "fırsat maliyetini azaltma": boost:return
  "sade ürün yapısı": boost:simplicity
  "çeşitlendirme": diversity
  "kur riskini yönetme": note:fx_priority
  "kuşaklar arası planlama": note:no_evidence_priority
priority_boost: 1.0

# acik_kisitlar phrase -> effect id (effects below).
constraints:
  "yüksek riskli ürünlerden kaçınma": risk_cap
  "döviz maruziyetini gerekçesiz artırmama": fx_limit
  "kısa vadeli nakit ihtiyacı varsayılmamalı": no_liquidity_need
  "tek ürün veya tek varlık sınıfında yoğunlaşmama": concentration_limit
  "uzun süre kilitli veya düşük likiditeli seçeneklerden kaçınma": liquidity_need
constraint_effects:
  risk_cap: {max_ceiling: 4}
  fx_limit: {min_fx_intensity: 0.5}
  no_liquidity_need: {liquidity_weight: 0.0, liquidity_intensity: 0.0}
  concentration_limit: {diversity: true}
  liquidity_need: {min_liquidity_intensity: 1.0}
  ignore: {}

# --- 4. Scoring ----------------------------------------------------------------------
kinds:   # liquidity / income / simplicity values (0..1)
  deposit:         {liquidity: 1.0, income: 1.0, simplicity: 1.0}
  time_deposit:    {liquidity: 0.6, income: 0.9, simplicity: 1.0}
  money_market:    {liquidity: 0.9, income: 0.6, simplicity: 1.0}
  debt:            {liquidity: 0.7, income: 0.5, simplicity: 0.7}
  participation:   {liquidity: 0.6, income: 0.4, simplicity: 0.6}
  precious_metals: {liquidity: 0.6, income: 0.2, simplicity: 0.7}
  equity:          {liquidity: 0.5, income: 0.2, simplicity: 0.6}
  variable:        {liquidity: 0.5, income: 0.2, simplicity: 0.3}
  mixed:           {liquidity: 0.5, income: 0.3, simplicity: 0.4}
  fund_of_funds:   {liquidity: 0.5, income: 0.2, simplicity: 0.3}

underperformance: {scale: 0.20}   # D10: B = EVDS market deposit rate net of the deposit stopaj
long_horizon: {period: 3y, liquidity_factor: 0.5, return_add: 1.0}   # D9: horizon 3+ years
fund_detail:                     # D12: TEFAS fund detail rows (ingest I3/I3b)
  buyable_quantity: fund_buyable           # 0 -> hard rule not_buyable
  sell_valor_quantity: fund_sell_valor_days
  entry_fee_quantity: fund_entry_fee
  exit_fee_quantity: fund_exit_fee
  liquidity_by_sell_valor:       # sell valör (days) -> liquidity; last row max_days null
    - {max_days: 0, value: 1.0}
    - {max_days: 1, value: 0.9}
    - {max_days: 2, value: 0.8}
    - {max_days: 3, value: 0.7}
    - {max_days: 5, value: 0.6}
    - {max_days: 10, value: 0.4}
    - {max_days: null, value: 0.2}
quality_value: {deposit: 0.5, time_deposit: 0.5}                      # D9: neutral (was 1)
principal_value: {deposit: 1.0, time_deposit: 1.0, fund_base: 0.8, fund_step: 0.15}   # fund: max(0, base - step*(risk-1))

# Raw weight = base + per_level * level (+ appetite terms), then normalized.
weights:
  return:     {base: 2.0, appetite: 2.0}   # was 1 + appetite (D9, 2026-10-10)
  low_risk:   {base: 1.0, appetite: -1.0}
  liquidity:  {base: 0.0, level: likidite_ihtiyaci, per_level: 2.0}
  income:     {base: 0.0, level: gelir_nakit_akisi_ihtiyaci, per_level: 2.0}
  principal:  {base: 0.0, level: anapara_koruma_tercihi, per_level: 2.0}
  simplicity: {base: 0.0}
  quality:    {base: 0.5}

penalties:   # max; penalty = max * intensity * violation
  principal: 0.3
  liquidity: 0.3
  fx_exposure: 0.3
  risk_unknown: 0.3
  risk_unknown_above_ceiling_factor: 2.0
  track_record: 0.2
  fund_size: 0.1
  real_loss: 0.3        # D9: x principal level x clamp(-real / loss_scale, 0, 1)
  underperformance: 0.3 # D10: x appetite x clamp((B - N) / underperformance.scale, 0, 1)
fund_size_min: {total_value_try: 100000000, investors: 100}

display:
  first: 3              # positions 1-3: at most first_cap per fund_kind
  first_cap: 1
  shortlist: 10         # positions 1-10: at most cap per fund_kind
  cap: 3
  diversity_cap: 2      # with concentration_limit or the çeşitlendirme priority
  pool: 20              # D10: with diversity, positions 1-20 ...
  diversity_pool_cap: 4 # ... at most 4 per kind

# --- 5. confidence / stability -------------------------------------------------------
confidence:
  flags: {needs_check: 0.9, manual_entry: 0.9, unverified_series: 0.8,
          fallback_snapshot: 0.8, stale: 0.7, conflict: 0.6}
  risk_estimate: 0.7
  shorter_period: 0.8
stability:
  step: 0.2             # each weight / penalty max x (1 - step) and x (1 + step)
  size: 20              # positions 1..size count as "in" (= the UI pool of 20, docs/ui.md)

# --- 6. Warnings -----------------------------------------------------------------------
warnings:
  low_stability_below: 0.5
  deposit_vs_market_points: 5.0

# --- Texts (Turkish; {name} fields are filled by the engine) -----------------------------
