# Eval config (docs/eval.md). Lead-owned; the eval worker asks for changes.
version: 1

snapshot: "20261014-233110-1565"   # frozen eval snapshot (2026-10-14 night: BYF, BIST shares 5y, BIST 100 5y, D26-D27; before: 20261014-102329-8fca)
max_cost_usd_per_run: 5.0      # the eval's own limit (the user, 2026-10-10)
report_dir: data/eval

judge:
  model: claude-haiku-5-5      # the user, 2026-10-10; Jev possible later
  effort: low
  max_tokens: 2000
  price_input_per_mtok: 0.10   # Claude API, cached 2026-10-06
  price_output_per_mtok: 0.50
  api_key_env: ANTHROPIC_API_KEY
  workspace_id_env: ANTHROPIC_WORKSPACE_ID
  rubric:                      # fixed choices per item: yes | partly | no
    - id: tailored
      question: "Uses this client's situation, goal, horizon, priorities and RM note (not a generic offer)?"
    - id: clear_for_rm
      question: "Clear and usable for the RM in the meeting (structure, length, order)? Technical terms are fine: the RM is a licensed professional (SPK Düzey 3); do not mark the text down for terms such as valör, stopaj, reel getiri or TÜFE."
    - id: balanced
      question: "States risks and uncertainty fairly next to the benefits (no sales pressure)?"

# E13: a second, independent A/B judge from another vendor (the user, 2026-10-28/29).
# Used by `rmprep eval-ab-replay`. The key is on the Gemini free tier (no charge; Google may
# use free-tier inputs, which here are synthetic personas and public fund data); the prices
# are the paid list prices (ai.google.dev pricing, 2026-10-29, valid to 2026-12-31), so the
# report shows what the same calls would cost on the paid tier.
second_ab_judge:
  provider: gemini
  model: gemini-3.8-flash
  max_tokens: 4000             # thinking tokens count here too
  thinking_level: low
  price_input_per_mtok: 0.75
  price_output_per_mtok: 3.75
  api_key_env: GEMINI_API_KEY
  min_interval_s: 8            # free-tier rate limit: at most ~7 calls a minute

targets:                       # docs/eval.md table
  rule_checks: 1.0
  narrator_pass_rate: 0.95
  forbidden_phrases: 0
