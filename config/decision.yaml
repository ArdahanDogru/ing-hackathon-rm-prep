# Decision layer configuration (docs/decision.md). Lead-owned.
# Every table, weight, penalty, threshold and text of the engine lives here;
# tuning is a change of this file, not of the code. config_hash = sha256 of
# this file AS PARSED (comments and spacing do not change it).
version: 1

# --- 1. Product universe --------------------------------------------------------
deposit:
  option_id: "deposit:ing_turuncu"
  label: "ING Turuncu Hesap (standart)"
  source: manual
  quantity: deposit_rate
  # entity = "<entity_prefix>, <tier>"; the persona has no amount, so one tier.
  entity_prefix: "ING Turuncu Hesap standart"
  tier: "100.000-249.999 TL"
  # EVDS market average, for the deposit_vs_market warning.
  market_entity: "TRY savings deposit rate up to 3M, weighted average (new deposits)"

# ING e-Vadeli Mevduat: one ranked option (contract v1.1, docs/decision.md section 1).
# entity = "<entity_prefix>, <term>, <tier>" (data/inbox/manual/ing_e_vadeli.csv).
time_deposit:
  option_id: "time_deposit:ing_e_vadeli"
  label: "ING e-Vadeli Mevduat"
  source: manual
  quantity: deposit_rate
  entity_prefix: "ING e-Vadeli Mevduat"
  term: "32-45 gün"
  tier: "99.999,99-250.000 TL"   # the column that holds 100.000-249.999 TL
  term_days: 32                 # renewed every 32 days (compounding of the net rate)

# Real return after tax (docs/decision.md 4.1b, D9). Rows in data/inbox/manual/.
real_return:
  cpi: {source: manual, quantity: cpi_annual, entity: "TÜFE yıllık değişim (TÜİK)"}
  stopaj:
    source: manual
    quantity: withholding_tax_rate
    deposit: "TL vadesiz mevduat ve günlük hesap (Turuncu Hesap türü)"
    time_deposit: "TL vadeli mevduat, 6 aya kadar vadeli"
    fund_default: "Yatırım fonu, diğer fonlar (değişken, borçlanma araçları, fon sepeti)"
    fund_by_kind: {money_market: "Yatırım fonu, para piyasası fonu"}
    etf: "Borsa yatırım fonu (BYF), tüm türler"                        # D26; 17.5 % [VARSAYIM]
    stock: "Borsa İstanbul payları, alım satım kazancı (gerçek kişi)"  # D26; 0 % (GİB)
  loss_scale: 0.10              # real_loss violation = clamp(-r / loss_scale, 0, 1)

# EntityInfo.category (TEFAS umbrella type) -> fund_kind; null = not in the universe.
fund_kinds:
  "Para Piyasası Şemsiye Fonu": money_market
  "Borçlanma Araçları Şemsiye Fonu": debt
  "Katılım Şemsiye Fonu": participation
  "Kıymetli Madenler Şemsiye Fonu": precious_metals
  "Hisse Senedi Şemsiye Fonu": equity
  "Değişken Şemsiye Fonu": variable
  "Karma Şemsiye Fonu": mixed
  "Fon Sepeti Şemsiye Fonu": fund_of_funds
  "Serbest Şemsiye Fonu": null     # qualified investors only

# Upper-case fund name contains one of these -> fx = true.
fx_name_words: ["DÖVİZ", "EUROBOND", "DOLAR"]

# --- 3. Persona text -> levels -----------------------------------------------------
# Keys are matched after normalization (Turkish lower case, spaces collapsed,
# punctuation dropped except + and -). No fuzzy matching.
risk_profiles:
  "Muhafazakâr": {ceiling: 2, appetite: 0.0}
  "Temkinli": {ceiling: 3, appetite: 0.3333333333}
  "Dengeli": {ceiling: 5, appetite: 0.6666666667}
  "Agresif": {ceiling: 7, appetite: 1.0}

horizon:
  # years <= max_years -> period; the last entry has no max.
  periods:
    - {max_years: 1, period: 6m}
    - {max_years: 3, period: 1y}
    - {max_years: null, period: 3y}
  years: {3m: 0.25, 6m: 0.5, 1y: 1, 3y: 3, 5y: 5}
  # fund_return_<period>; next shorter one if missing.
  fallback: [3y, 1y, 6m, 3m]

levels: {"Düşük": 0.0, "Orta": 0.5, "Yüksek": 1.0}

fx_levels: {"Sınırlı": 1.0, "Açık": 0.0, "Çeşitlendirilmiş": 0.0}

# Safe level used (with an assumption) while a non-blocking question is open.
safe_levels:
  yatirim_ufku: 6m
  likidite_ihtiyaci: "Yüksek"
  anapara_koruma_tercihi: "Yüksek"
  gelir_nakit_akisi_ihtiyaci: "Orta"
  doviz_maruz_kalma_tercihi: "Sınırlı"

# oncelikler phrase -> effect. boost:<criterion> adds priority_boost to its raw
# weight; diversity sets the cap of the first 10 to diversity_cap; note:<key>
# only adds the assumption text assumptions.<key>.
priorities:
  "düzenli gelir": boost:income
  "likiditeyi koruma": boost:liquidity
  "erişilebilir likidite": boost:liquidity
  "yüksek likidite": boost:liquidity
  "sınırlı dalgalanma": boost:risk_fit
  "uzun vadeli dayanıklılık": boost:risk_fit
  "sermayenin korunması": boost:principal
  "uzun vadeli büyüme": boost:return
  "fırsat maliyetini azaltma": boost:return
  "sade ürün yapısı": boost:simplicity
  "çeşitlendirme": diversity
  "kur riskini yönetme": note:fx_priority
  "kuşaklar arası planlama": note:no_evidence_priority
priority_boost: 1.0

# acik_kisitlar phrase -> effect id (effects below).
constraints:
  "yüksek riskli ürünlerden kaçınma": risk_cap
  "döviz maruziyetini gerekçesiz artırmama": fx_limit
  "kısa vadeli nakit ihtiyacı varsayılmamalı": no_liquidity_need
  "tek ürün veya tek varlık sınıfında yoğunlaşmama": concentration_limit
  "uzun süre kilitli veya düşük likiditeli seçeneklerden kaçınma": liquidity_need
constraint_effects:
  risk_cap: {max_ceiling: 4}
  fx_limit: {min_fx_intensity: 0.5}
  no_liquidity_need: {liquidity_weight: 0.0, liquidity_intensity: 0.0}
  concentration_limit: {diversity: true}
  liquidity_need: {min_liquidity_intensity: 1.0}
  ignore: {}

# --- D19: asset classes, risk fit, recommended top 3 (docs/decision.md section 10) ------
asset_classes:
  by_name: {"PARA PİYASASI": nakit_benzeri, "KISA VADELİ": nakit_benzeri, "BORÇLANMA ARACI": borclanma,
            "ALTIN": altin_doviz, "KIYMETLİ MADENLER": altin_doviz}   # D23: "ÇOKLU VARLIK" removed, the holdings decide
  # D23 (docs/decision.md section 13, option A, the user 2026-10-14): the class from the
  # holdings (TEFAS varlikData) for these fund kinds; FX debt majority for debt funds.
  # Texts and classes: scripts/analysis/varlik_impact.py (snapshot 20261014-005625-c76a).
  by_holdings:
    kinds: [variable, mixed, fund_of_funds, participation]
    fx_debt_kinds: [debt]
    min_share: 50
    class_labels: {nakit_benzeri: "nakit benzeri", borclanma: "borçlanma araçları",
                   hisse: "hisse senedi", altin_doviz: "altın ve döviz"}
    labels:
      nakit_benzeri: ["Ters-Repo", "Repo", "Mevduat (TL)", "Katılma Hesabı (TL)", "Takasbank Para Piyasası",
                      "Borsa İstanbul Para Piyasası", "BİST Taahhütlü İşlem Pazarı Alım",
                      "BİST Taahhütlü İşlem Pazarı Satım"]
      borclanma: ["Devlet Tahvili", "Hazine Bonosu", "Özel Sektör Tahvili", "Finansman Bonosu",
                  "Özel Sektör Kira Sertifikaları", "Kamu Kira Sertifikaları (TL)",
                  "Varlığa Dayalı Menkul Kıymetler"]
      hisse: ["Hisse Senedi", "Yabancı Hisse Senedi", "Yabancı Borsa Yatırım Fonları"]
      altin_doviz: ["Kıymetli Madenler", "Kıymetli Madenler Cinsinden BYF",
                    "Kıymetli Madenler Cinsinden İhraç Edilen Kamu Kira Sertifikaları",
                    "Kıymetli Madenler Cinsinden İhraç Edilen Kamu Borçlanma Araçları",
                    "Mevduat (Döviz)", "Mevduat (Altın)", "Katılma Hesabı (Altın)", "Katılma Hesabı (Döviz)",
                    "Özel Sektör Dış Borçlanma Araçları", "Kamu Dış Borçlanma Araçları",
                    "Yabancı Özel Sektör Borçlanma Araçları", "Yabancı Kamu Borçlanma Araçları",
                    "Döviz Cinsi Kamu İç Borçlanma Araçları", "Kamu Kira Sertifikaları (Döviz)",
                    "Özel Sektör Yurt Dışı Kira Sertifikaları", "Kamu Yurt Dışı Kira Sertifikaları"]
      fon: ["Yatırım Fonları Katılma Payları", "Borsa Yatırım Fonları Katılma Payları",
            "Girişim Sermayesi Yatırım Fonları Katılma Payları", "Gayrimenkul Yatırım Fonları Katılma Payları"]
      ignore: ["Diğer", "Vadeli İşlemler Nakit Teminatları"]
  by_risk: {participation: [{min_risk: 5, class: hisse}]}   # D19c: participation equity funds
  by_kind: {deposit: nakit_benzeri, time_deposit: nakit_benzeri, money_market: nakit_benzeri,
            debt: borclanma, participation: borclanma, variable: dengeli, mixed: dengeli,
            fund_of_funds: dengeli, equity: hisse, precious_metals: altin_doviz}
  fx: altin_doviz                    # an FX fund (fx tag)
risk_fit:                            # ASSUMPTION (2026-10-12): bands to check with the mentors
  bands: {"Muhafazakâr": [1, 2], "Temkinli": [2, 3], "Dengeli": [3, 5], "Agresif": [4, 7]}
  per_step: 0.5                      # tuned on 20261010-183835-6813: 0.25 kept Dengeli at risk 2
recommend:
  max_per_class: 1
  max_cash_like: 1
  cash_like: nakit_benzeri
  profiles: ["Dengeli", "Agresif"]   # also with the diversity priority / concentration_limit
  min_real_return: 0.0               # D19b: no class-rule pick with a negative real 1-year return (%)

# D21: a fund without an SPK risk row gets the upper quartile of the known risk values of
# its asset class in the snapshot (rounded up); fewer than min_known values -> old kind rule
risk_estimate: {by_class_quantile: 0.75, min_known: 5}

# --- D20: model allocation bands (docs/decision.md section 11) ---------------------------
# Source: Ata Yatırım, "Yatırım Portföyü Oluşturma Stratejileri ve Rehberi", 28.04.2026,
# table "Risk Profillerine Göre Örnek Portföy Yapıları"; its gold/commodity column is our
# altin_doviz (no public FX band). Temkinli has no source: our inference between
# Muhafazakâr and Dengeli. dengeli (multi-asset funds) has no band. Strategic bands, to be
# confirmed with the mentors (question 6); no current shares, no amounts.
allocation:
  classes: [nakit_benzeri, borclanma, hisse, altin_doviz, dengeli]
  profiles:
    "Muhafazakâr": {source: "Ata Yatırım, 28.04.2026", inferred: false, bands: {nakit_benzeri: [10, 20], borclanma: [60, 70], hisse: [10, 20], altin_doviz: [5, 10]}}
    "Temkinli": {source: "çıkarım (Muhafazakâr–Dengeli arası)", inferred: true, bands: {nakit_benzeri: [5, 20], borclanma: [40, 60], hisse: [20, 40], altin_doviz: [5, 15]}}
    "Dengeli": {source: "Ata Yatırım, 28.04.2026", inferred: false, bands: {nakit_benzeri: [5, 10], borclanma: [30, 40], hisse: [40, 50], altin_doviz: [10, 15]}}
    "Agresif": {source: "Ata Yatırım, 28.04.2026", inferred: false, bands: {nakit_benzeri: [0, 5], borclanma: [5, 10], hisse: [70, 85], altin_doviz: [5, 10]}}
  note_texts:
    ceiling: "Risk tavanı nedeniyle uygun fon yok."
    none: "Bu sınıfta puanlanan seçenek yok."
    negative_real: "Son 1 yıl reel {figure}: önerilmiyor."
  holding_hints:
    "mevduat ağırlıklı": "Dosyaya göre varlık TL mevduat ağırlıklı: nakit benzeri bandı aşılıyor olabilir."
  holding_confirm: "Mevcut portföy dağılımını sorun."

# --- D27 (docs/decision.md section 17; spec 2026-10-14-portfolio-projection-design.md) ---
# The client's current split: RM input > persona text rules > job row > national default.
# Only rm, rm_confirmed and persona_text change the ranking (brief: no made-up client
# information); job and national values are a proposal for the RM ("tahmini senaryo").
holdings:
  national:
    label: "Türkiye hanehalkı ortalaması"
    source: "TCMB Finansal İstikrar Raporu 2026-I, Tablo III.1.2 (Mart 2026)"
    url: "https://www.tcmb.gov.tr/wps/wcm/connect/559f289f-e867-459e-a485-bb8a450da29e/Tam+Metin.pdf?MOD=AJPERES&CACHEID=ROOTWORKSPACE-559f289f-e867-459e-a485-bb8a450da29e-pVeCfc8"
    # Look-through of funds by the lead (fund-market shares of FİR section V.1,
    # 30.04.2026); FX and precious-metal deposits -> altin_doviz; gold "under the
    # pillow" is not in the data.
    shares: {nakit_benzeri: 39, borclanma: 10, hisse: 10, altin_doviz: 30, dengeli: 11}
  # [VARSAYIM] no Turkish split by job or age exists (research 2026-10-14); each row
  # is the national default moved by the stated rule.
  profiles:
    - {match: ["emekli"], label: "Emekli", source: "varsayım",
       rule: "Ulusal ortalamadan: hisse azaltıldı, borçlanma ve nakit artırıldı (emeklilik dönemi).",
       shares: {nakit_benzeri: 32, borclanma: 22, hisse: 10, altin_doviz: 26, dengeli: 10}}
    - {match: ["ihracatçı", "şirket sahibi"], label: "Şirket sahibi (ihracatçı)", source: "varsayım",
       rule: "Döviz geliri: TL nakitten döviz/altına 8 puan (bireysel mevduatın %47'si döviz, TCMB FİR 2026-I).",
       shares: {nakit_benzeri: 22, borclanma: 22, hisse: 13, altin_doviz: 33, dengeli: 10}}
    - {match: ["teknoloji kurucusu", "kurucu"], label: "Kurucu", source: "varsayım",
       rule: "Şirket satışından gelen nakit önce mevduat ve para piyasasında durur; genç yaş: hisse daha yüksek.",
       shares: {nakit_benzeri: 45, borclanma: 12, hisse: 20, altin_doviz: 15, dengeli: 8}}
    - {match: ["aile ofisi"], label: "Aile ofisi", source: "UBS Global Family Office Report 2025 (Orta Doğu), Türkiye için uyarlandı",
       rule: "UBS 10/29/39/1/20; Türkiye için daha fazla döviz ve altın.",
       shares: {nakit_benzeri: 15, borclanma: 28, hisse: 27, altin_doviz: 15, dengeli: 15}}
    - {match: ["hekim", "doktor"], label: "Hekim", source: "varsayım",
       rule: "Düzenli birikim: BES ve fon birikim planları, dengeli fon payı yüksek.",
       shares: {nakit_benzeri: 28, borclanma: 12, hisse: 13, altin_doviz: 25, dengeli: 22}}
  # A rule only for a sentence that states the client's assets (not income, not goals).
  text_rules:
    - {id: mevduat_agirlikli, fields: [durum], match: "mevduat ağırlıklı", class: nakit_benzeri, range: [60, 90]}
    - {id: sirket_satisi_nakit, fields: [durum], match: "şirket satışından gelen nakdi", class: nakit_benzeri, range: [50, 100]}
  spread: 5
allocation_gap:
  scale: 30
  overweight_factor: 0.5
  per_signal: 0.5
  max_signals: 2
  source_factor: {rm: 1.0, rm_confirmed: 0.75, persona_text: 0.75}
  signals: ["çeşitlendirme", "mevduat yoğunluğunu azalt", "tek ürün veya tek varlık sınıfında yoğunlaşmama", "fırsat maliyetini azaltma"]

# --- 4. Scoring ----------------------------------------------------------------------
kinds:   # liquidity / income / simplicity values (0..1)
  deposit:         {liquidity: 1.0, income: 1.0, simplicity: 1.0}
  time_deposit:    {liquidity: 0.6, income: 0.9, simplicity: 1.0}
  money_market:    {liquidity: 0.9, income: 0.6, simplicity: 1.0}
  debt:            {liquidity: 0.7, income: 0.5, simplicity: 0.7}
  participation:   {liquidity: 0.6, income: 0.4, simplicity: 0.6}
  precious_metals: {liquidity: 0.6, income: 0.2, simplicity: 0.7}
  equity:          {liquidity: 0.5, income: 0.2, simplicity: 0.6}
  variable:        {liquidity: 0.5, income: 0.2, simplicity: 0.3}
  mixed:           {liquidity: 0.5, income: 0.3, simplicity: 0.4}
  fund_of_funds:   {liquidity: 0.5, income: 0.2, simplicity: 0.3}
  etf:             {liquidity: 0.8, income: 0.2, simplicity: 0.6}   # D26: T+2 on the exchange
  stock:           {liquidity: 0.8, income: 0.2, simplicity: 0.4}   # D26: one company

# D26 (docs/decision.md section 16): exchange-traded funds and Borsa İstanbul shares.
etf:
  source: tefas_byf
  by_name: {"ALTIN": altin_doviz, "GÜMÜŞ": altin_doviz, "TLREF": nakit_benzeri}
  default_class: hisse
stock:
  source: bist_bulletin
  risk_floor: 6                 # [VARSAYIM] one company's risk is concentrated
  min_turnover_try: 10000000    # size penalty below this 3-month mean daily turnover
  max_in_top3: 1
  # SPK fund guide 9.3.2.1 (table of 12.10.2023): [upper annual volatility % (exclusive), risk]; above the last: 7
  spk_bands: [[2, 1], [5, 2], [10, 3], [15, 4], [20, 5], [30, 6]]
  asset_class: hisse
  # D26b [VARSAYIM, lead 2026-10-14]: W = Yakın İzleme Pazarı; S = Nitelikli Yatırımcı
  # İşlem Pazarı or the pre-market platform (code not confirmed); both restricted
  exclude_markets: [W, S]
  # 2026-10-14 (the user): a share in the top 3 or the short list that fell this much
  # in 1 month gets an RM warning (e.g. a series of limit-down days); not an exclusion
  crash_1m_pct: -50

underperformance: {scale: 0.20}   # D10: B = EVDS market deposit rate net of the deposit stopaj
long_horizon: {period: 3y, liquidity_factor: 0.5, return_add: 1.0}   # D9: horizon 3+ years
constraint_rules:                # D13: explicit constraints as hard rules (needs fund_detail)
  fx_limit:
    override_choices: ["uygula", "gerekçeyle kaldır"]
    override_lifts: "gerekçeyle kaldır"
  liquidity_need:
    max_sell_valor_days: 3
    max_lock_days: 91
short_history:                   # D15: a fund needs a return of min_period or longer
  min_period: 3m
  allow_appetite: 1.0            # appetite >= this (Agresif) keeps it, with the track_record penalty
fund_detail:                     # D12: TEFAS fund detail rows (ingest I3/I3b)
  buyable_quantity: fund_buyable           # 0 -> hard rule not_buyable
  sell_valor_quantity: fund_sell_valor_days
  entry_fee_quantity: fund_entry_fee
  exit_fee_quantity: fund_exit_fee
  liquidity_by_sell_valor:       # sell valör (days) -> liquidity; last row max_days null
    - {max_days: 0, value: 1.0}
    - {max_days: 1, value: 0.9}
    - {max_days: 2, value: 0.8}
    - {max_days: 3, value: 0.7}
    - {max_days: 5, value: 0.6}
    - {max_days: 10, value: 0.4}
    - {max_days: null, value: 0.2}
quality_value: {deposit: 0.5, time_deposit: 0.5}                      # D9: neutral (was 1)
principal_value: {deposit: 1.0, time_deposit: 1.0, fund_base: 0.8, fund_step: 0.15}   # fund: max(0, base - step*(risk-1))

# Raw weight = base + per_level * level (+ appetite terms), then normalized.
weights:
  return:     {base: 2.0, appetite: 2.0}   # was 1 + appetite (D9, 2026-10-10)
  risk_fit:   {base: 2.0}                  # D19: replaces low_risk {base 1, appetite -1}
  liquidity:  {base: 0.0, level: likidite_ihtiyaci, per_level: 2.0}
  income:     {base: 0.0, level: gelir_nakit_akisi_ihtiyaci, per_level: 2.0}
  principal:  {base: 0.0, level: anapara_koruma_tercihi, per_level: 2.0}
  simplicity: {base: 0.0}
  quality:    {base: 0.5}
  allocation_gap: {base: 1.0}               # D27: x source factor x (1 + per_signal x signals); 0 without an active class

penalties:   # max; penalty = max * intensity * violation
  principal: 0.3
  liquidity: 0.3
  fx_exposure: 0.3
  risk_unknown: 0.3
  risk_unknown_above_ceiling_factor: 2.0
  track_record: 0.2
  fund_size: 0.1
  real_loss: 0.3        # D9: x principal level x clamp(-real / loss_scale, 0, 1)
  underperformance: 0.3 # D10: x appetite x clamp((B - N) / underperformance.scale, 0, 1)
fund_size_min: {total_value_try: 100000000, investors: 100}

display:
  first: 3              # positions 1-3: at most first_cap per fund_kind
  first_cap: 1
  shortlist: 10         # positions 1-10: at most cap per fund_kind
  cap: 3
  diversity_cap: 2      # with concentration_limit or the çeşitlendirme priority
  pool: 20              # D10: with diversity, positions 1-20 ...
  diversity_pool_cap: 4 # ... at most 4 per kind
  # D17 (web UI, docs/decision.md section 9): "Paraya erişim" and the
  # "Bu müşteri için neden?" lines, by criterion; {access} {risk} {ret1y}.
  # No score numbers; a line whose value is missing is left out.
  access:
    same_day: "Aynı gün"
    days: "{days} iş günü"
    term: "Vade sonunda ({days} gün)"
    exchange: {TR: "2 iş günü (borsa takası)", EN: "2 business days (exchange settlement)"}   # D26
  why:
    liquidity: "Paraya erişim: {access}"
    risk_fit: "SPK risk değeri {risk} / 7"
    principal: "SPK risk değeri {risk} / 7"
    income: "Son bir yılda {ret1y} getiri (geçmiş getiri)"
    return: "Son bir yılda {ret1y} getiri (geçmiş getiri)"

# --- 5. confidence / stability -------------------------------------------------------
confidence:
  flags: {needs_check: 0.9, manual_entry: 0.9, unverified_series: 0.8,
          fallback_snapshot: 0.8, stale: 0.7, conflict: 0.6}
  risk_estimate: 0.7
  shorter_period: 0.8
  liquidity_proxy: 0.8  # D14: fund_detail configured, but no sell valör row -> liquidity from the kind table
  real_return_missing: 0.8  # D24: no TÜFE row, or no stopaj row for the option's product type
stability:
  step: 0.2             # each weight / penalty max x (1 - step) and x (1 + step)
  size: 20              # positions 1..size count as "in" (= the UI pool of 20, docs/ui.md)

# --- 6. Warnings -----------------------------------------------------------------------
warnings:
  low_stability_below: 0.5
  deposit_vs_market_points: 5.0
  # D16 (web UI): who may read a warning; any other code is "rm" (RM only,
  # never in client-facing text)
  audience: {concentration: client, fx_exposure: client}

